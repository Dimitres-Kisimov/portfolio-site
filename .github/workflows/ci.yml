name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling (ruff, pytest, matplotlib)
        run: pip install ruff pytest matplotlib

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Regenerate the site
        run: python build.py

      - name: Regenerated site must match the committed index.html
        run: git diff --exit-code -- index.html

      - name: Site quality gate (well-formedness, links, a11y, bilingual DOM, claims, AA contrast)
        run: python tools/validate_site.py

      - name: index.html must exist and be non-empty
        run: |
          test -s index.html
          echo "index.html size: $(wc -c < index.html) bytes"

      - name: Offline / copyright-free guard (no external asset references)
        run: |
          set -e
          fail=0

          # 1) No external src= on any asset (scripts, images).
          if grep -nE 'src=["'"'"']https?://' index.html; then
            echo "::error::External src= asset reference found in index.html"; fail=1
          fi

          # 2) No external stylesheet/font <link href="http...">.
          if grep -nE '<link[^>]+href=["'"'"']https?://' index.html; then
            echo "::error::External <link> stylesheet/font reference found"; fail=1
          fi

          # 3) No CSS @import or url(http...) in HTML or CSS (blocks web fonts / CDN assets).
          if grep -nE '@import|url\(\s*["'"'"']?https?://' index.html styles.css; then
            echo "::error::CSS @import or external url() reference found"; fail=1
          fi

          # 4) No web-font / CDN loaders anywhere in the shipped assets.
          if grep -niE 'fonts\.googleapis|fonts\.gstatic|@font-face|unpkg\.com|jsdelivr|cdnjs|cloudflare' index.html styles.css app.js; then
            echo "::error::Web-font or CDN loader reference found"; fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Offline/copyright-free guard FAILED."; exit 1
          fi
          echo "Offline/copyright-free guard passed: no external asset references."
          echo "(Anchor links to github.com in rendered <a> tags are allowed and not scanned.)"

      - name: Build the PDF one-pager (deliverables)
        run: python tools/make_onepager.py

      - name: PDF must exist and exceed 10 KB
        run: |
          size=$(wc -c < deliverables/portfolio_onepager.pdf)
          echo "portfolio_onepager.pdf size: $size bytes"
          test "$size" -gt 10240
